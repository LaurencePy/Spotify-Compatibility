<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Compatibility Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <h2>Spotify Stats</h2>
            <ul>
                <li><a href="#" id="profile-tab">Profile</a></li>
                <li><a href="#" id="top-artists-tab">Top Artists</a></li>
                <li><a href="#" id="top-tracks-tab">Top Tracks</a></li>
                <li><a href="#" id="followed-users-tab">Followed Users</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="content">
            <!-- Profile Section -->
            <section id="profile-section" class="section">
                <div id="profile">
                    <h2>Loading profile...</h2>
                </div>
            </section>

            <!-- Top Artists -->
            <section id="top-artists-section" class="section">
                <h3>Top Artists</h3>
                <div id="top-artists" class="grid">
                    <p>Loading top artists...</p>
                </div>
            </section>

            <!-- Top Tracks -->
            <section id="top-tracks-section" class="section">
                <h3>Top Tracks</h3>
                <div id="top-tracks" class="grid">
                    <p>Loading top tracks...</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
